<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>head style</title>
<style type="text/css">
body { margin: 0; font-family: Georgia, serif; }
.shell { max-width: 600px; margin: 0 auto; }
.brand { color: #c0392b; font-size: 32px; margin: 16px 0 4px; }
.lede { color: #666; font-style: italic; }
.button { display: inline-block; background: #1f5fbf; color: #fff !important; padding: 10px 18px; border-radius: 4px; text-decoration: none; }
</style>
<style media="(max-width: 480px)">
.brand { font-size: 24px; }
</style>
</head>
<body>
<table class="shell" width="100%" cellpadding="0" cellspacing="0"><tr><td>
<h1 class="brand">Weekend Reader</h1>
<p class="canary lede">16 head style: the heading must be large and red, this lede grey and italic, the button blue with white text.</p>
<a class="button" href="https://example.com/read">Read the issue</a>
</td></tr></table>
</body>
</html>
