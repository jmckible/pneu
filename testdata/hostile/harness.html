<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>pneu hostile harness</title>
<style>
body { margin: 0; font: 13px monospace; }
#frames { width: 640px; }
#frames section { border-top: 1px solid #999; }
#frames iframe.mail { display: block; width: 100%; border: 0; height: 0; box-sizing: border-box; }
/* app.css's sheet, so sizing is checked with its margin and border. */
#frames iframe.mail.sheet { margin: 8px 1ch; width: calc(100% - 2ch); border: 1px solid #999; }
</style>
<!-- The same files the app serves, by relative path: this page tests the
     shipping assembly, not a copy of it. Served from the repo root by run.sh. -->
<script src="../../web/static/purify.min.js"></script>
<script src="../../web/static/mailframe.js"></script>
<!-- declaredAction, which mailframe.js calls for the o action (46–53). -->
<script src="../../web/static/actions.js"></script>
</head>
<body>
<pre id="results">pending</pre>
<div id="frames"></div>
<script>
(async function () {
  'use strict';
  const out = document.getElementById('results');
  const origin = location.origin;
  const LINK_OK = /^(?:https?:\/\/|mailto:)/i;
  const FORBIDDEN = 'script, iframe, frame, frameset, object, embed, portal, form, input, button, ' +
    'textarea, select, link, noscript, template, isindex, marquee[onstart]';
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  // Click-to-load needs an https host that is not an IP literal or localhost:
  // run.sh serves one and maps remote.test to it (--host-resolver-rules).
  const httpsPort = new URLSearchParams(location.search).get('https') || '443';
  const remoteOrigin = 'https://remote.test:' + httpsPort;
  const remoteURL = remoteOrigin + '/testdata/hostile/harness-pixel.svg';
  const openerURL = origin + '/testdata/hostile/opener.html#';
  const SYNTHETIC = {
    remote: () => '<!DOCTYPE html><html><head></head><body><p class="canary">remote image</p>' +
      '<img src="' + remoteURL + '" width="8" height="8" alt="remote"></body></html>',
    cidcss: () => '<!DOCTYPE html><html><head></head><body><p class="canary">cid in srcset and css</p>' +
      '<img src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" srcset="cid:logo@hostile.test 2x" alt="srcset">' +
      '<div style="background:url(cid:logo@hostile.test);height:8px"></div></body></html>',
    partbase: () => '<!DOCTYPE html><html><head></head><body><p class="canary">part base</p>' +
      '<img src="cid:mine@hostile.test" width="8" height="8" alt="mine">' +
      '<img src="cid:other@hostile.test" width="8" height="8" alt="other">' +
      '<div style="background:url(/part/harness-pixel.svg);height:8px">other part via css</div></body></html>',
    keys: () => '<!DOCTYPE html><html><head></head><body><p class="canary">key forwarding</p></body></html>',
    link: (c) => '<!DOCTYPE html><html><head></head><body><p class="canary">link click</p>' +
      '<a href="' + openerURL + c.id + '">open</a></body></html>',
  };

  // CSP violations, recorded from the parent realm: the frame runs no script.
  // First render: the srcdoc document reuses the Window of the frame's
  // initial about:blank (same origin), so a listener put on contentWindow
  // right after insertion hears every violation. A re-render replaces the
  // Window, and nothing can be attached before the new document exists, so
  // it is polled for and may miss violations queued before the first poll.
  // Informational either way; a case's `blocked` assertion is only as good
  // as this.
  function watchViolations(frame, set) {
    const record = (e) => set.add(e.effectiveDirective + ' ' + e.blockedURI);
    const seen = new WeakSet();
    const win = frame.contentWindow;
    if (win) { win.addEventListener('securitypolicyviolation', record, true); seen.add(win); }
    const t0 = performance.now();
    const hook = () => {
      const w = frame.contentWindow;
      if (w && !seen.has(w)) { seen.add(w); w.addEventListener('securitypolicyviolation', record, true); return; }
      if (performance.now() - t0 < 3000) setTimeout(hook, 0);
    };
    setTimeout(hook, 0);
  }

  // Positive control for the link check: the shipping assembly, then
  // rel=opener put back before srcdoc. The harness must see the popup get an
  // opener and navigate the frame, or the negative case proves nothing.
  function renderWithOpener(html) {
    const built = Pneu.assembleMailDocument(html, {}, origin, {});
    const doc = new DOMParser().parseFromString(built.srcdoc, 'text/html');
    for (const a of doc.querySelectorAll('a')) a.setAttribute('rel', 'opener');
    const frame = document.createElement('iframe');
    frame.className = 'mail';
    frame.style.height = '60px';
    frame.setAttribute('sandbox', Pneu.MAILFRAME_SANDBOX);
    frame.srcdoc = '<!DOCTYPE html>' + doc.documentElement.outerHTML;
    return { frame, remote: built.remote };
  }

  try {
    try { localStorage.clear(); } catch (e) { /* the link cases report missing */ }
    const cases = await (await fetch('cases.json')).json();
    const runs = [];
    for (const c of cases) {
      // Case files name the https server as https://remote.test/ (38); its
      // port is only known at run time.
      const html = c.synthetic ? SYNTHETIC[c.synthetic](c) :
        (await (await fetch(c.file)).text()).replaceAll('https://remote.test/', remoteOrigin + '/');
      const keys = [], blocked = new Set();
      const opts = {
        remoteImages: !!c.remoteImages && !c.rerender,
        partBase: c.partBase,
        theme: c.theme,
        onKeydown: (e) => keys.push(e.key),
      };
      let built = c.control ? renderWithOpener(html) : Pneu.renderMailFrame(html, c.cids || {}, origin, opts);
      const section = document.createElement('section');
      section.dataset.case = c.id;
      section.appendChild(built.frame);
      const nextLoad = (frame) => new Promise((resolve) => {
        frame.addEventListener('load', () => resolve(true), { once: true });
        setTimeout(() => resolve(false), 3000);
      });
      let loaded = nextLoad(built.frame);
      document.getElementById('frames').appendChild(section);
      watchViolations(built.frame, blocked);
      if (c.rerender) {
        // Click-to-load path: re-render into the same frame, as app.js does.
        await loaded;
        built = Pneu.renderMailFrame(html, c.cids || {}, origin,
          { remoteImages: true, partBase: c.partBase, theme: c.theme, frame: built.frame, onKeydown: opts.onKeydown });
        loaded = nextLoad(built.frame);
        watchViolations(built.frame, blocked);
      }
      runs.push({
        c, html, frame: built.frame, remote: built.remote, colors: built.colors, sheet: built.sheet,
        action: built.action, ldBlocks: built.ldBlocks, keys, blocked, loaded,
      });
    }
    for (const r of runs) r.loaded = await r.loaded;
    await sleep(400); // images, ResizeObserver sizing

    for (const r of runs) {
      if (r.c.synthetic === 'keys' && r.frame.contentDocument) {
        const win = r.frame.contentWindow;
        r.frame.contentDocument.body.dispatchEvent(new win.KeyboardEvent('keydown', { key: 'j', bubbles: true }));
      }
    }
    await sleep(50);

    // The button heuristic (54-61) on each laid-out frame, read-only:
    // the frame's document is the same before and after.
    for (const r of runs) {
      if (!('guess' in r.c) || !r.frame.contentDocument) continue;
      const root = Object.getOwnPropertyDescriptor(Document.prototype, 'documentElement').get.call(r.frame.contentDocument);
      const before = root.outerHTML;
      const g = Pneu.actions.guess(r.frame, [origin]);
      r.guess = {
        layout: g.layout,
        pick: g.pick && { text: g.pick.label, host: new URL(g.pick.url).hostname },
        runnerUp: g.runnerUp ? new URL(g.runnerUp.url).hostname : null,
        over: g.over,
        hosts: g.ranked.map((x) => new URL(x.url).hostname),
        touched: root.outerHTML !== before,
      };
    }

    // Link clicks, after every other check has its snapshot of a settled
    // frame. run.sh passes --disable-popup-blocking so a scripted click opens.
    const appHref = location.href;
    const clicks = runs.filter((r) => r.c.click);
    for (const r of clicks) {
      r.before = snapshot(r);
      const a = r.frame.contentDocument && r.frame.contentDocument.querySelector('a');
      if (a) HTMLElement.prototype.click.call(a);
    }
    for (const r of clicks) {
      const key = 'pneu-opener:' + r.c.id;
      for (let i = 0; i < 60 && localStorage.getItem(key) === null; i++) await sleep(50);
      await sleep(100); // a tabnabbing navigation lands after the report
      const got = localStorage.getItem(key);
      r.popup = got === null ? null : JSON.parse(got);
      r.appHrefAfter = location.href;
    }

    const results = runs.map((r) => {
      try { return check(r, appHref); } catch (e) { return { id: r.c.id, pass: false, fails: ['harness error: ' + e] }; }
    });
    // The trusted document's sinks, after every case has its snapshot.
    for (const res of await appChecks(runs)) results.push(res);
    for (const res of await pageChecks()) results.push(res);
    for (const res of await guessPageChecks()) results.push(res);
    const pwned = window.__pwned;
    const appWide = document.documentElement.scrollWidth > window.innerWidth;
    const summary = {
      pass: results.every((r) => r.pass) && pwned === undefined && !appWide,
      pwned: pwned === undefined ? null : String(pwned),
      appScrollsHorizontally: appWide,
      cases: results,
    };
    out.textContent = JSON.stringify(summary, null, 1);
  } catch (e) {
    out.textContent = JSON.stringify({ pass: false, error: String(e && e.stack || e) });
  }
  document.body.dataset.done = '1';

  // ---- the trusted document (docs/actions.md) -------------------------------
  // The cases above check what the sanitizer lets into the frame. These check
  // the sinks that put sender data into the app's own document: the o chip,
  // o itself, and link hints, in an app-shaped document (#app) that loads the
  // shipping app.css, mailframe.js and actions.js. window.open is intercepted
  // there; nothing navigates. Each result is reported like a case.
  async function appChecks(runs) {
    const results = [];
    const check = async (id, fn) => {
      out.textContent = 'pending: ' + id; // where a hang stopped, in run.sh's failure
      const fails = [];
      try { await fn(fails); } catch (e) { fails.push('harness error: ' + (e && e.stack || e)); }
      results.push({ id, pass: fails.length === 0, fails });
    };
    out.textContent = 'pending: app document';
    const app = await appDocument();
    const W = app.contentWindow, D = app.contentDocument;
    const A = W.Pneu && W.Pneu.actions;
    if (!A || !W.Pneu.renderMailFrame) return [{ id: 'app-document', pass: false, fails: ['app scripts did not load'] }];
    const opens = [];
    W.open = (url, target, features) => { opens.push([String(url), target, features]); return null; };
    const pane = D.querySelector('main.thread'), article = D.querySelector('article.message');
    const header = article.querySelector(':scope > header'), from = header.querySelector('.from');
    const statusEl = D.getElementById('status');
    const ident = { account: 'p', msgid: 'm%40hostile.test', article, root: pane };
    // Rendering steps (scroll events, sizing); under the harness's virtual
    // time a timer stands in for a frame that never comes.
    const frames = (n) => new Promise((r) => { const step = () => (n-- > 0 ? Promise.race([new Promise((f) => W.requestAnimationFrame(f)), sleep(40)]).then(step) : r()); step(); });
    const within = (r, b) => r.left >= b.left - 0.5 && r.top >= b.top - 0.5 && r.right <= b.right + 0.5 && r.bottom <= b.bottom + 0.5;
    const box = (r) => [r.left, r.top, r.right, r.bottom].map(Math.round).join(',');
    const key = (k, extra) => Object.assign({ key: k, code: k, preventDefault() { this.prevented = true; }, stopPropagation() {} }, extra);
    // What of the pane shows, as app.js paneBounds: pane ∩ viewport, above the key bar.
    const bounds = () => {
      const p = pane.getBoundingClientRect(), bar = D.getElementById('keybar').getBoundingClientRect();
      return { left: Math.max(p.left, 0), top: Math.max(p.top, 0), right: Math.min(p.right, W.innerWidth), bottom: Math.min(p.bottom, W.innerHeight, bar.top) };
    };
    const flashes = [];
    const hintCtx = (frame) => ({
      frame, bounds: bounds(),
      status: (n) => {
        if (n) { statusEl.replaceChildren(n); statusEl.className = 'show hint'; return; }
        if (statusEl.classList.contains('hint')) { statusEl.className = ''; statusEl.replaceChildren(); }
      },
      statusBox: () => statusEl,
      flash: (t) => flashes.push(t),
      onClose() {},
    });
    // Under the harness's virtual time no rendering step runs, so a scroll
    // event is dispatched by hand where the browser would fire one.
    const scrolled = (el) => el.dispatchEvent(new W.Event('scroll'));
    const scrollPane = async (y) => { pane.scrollTop = y; scrolled(pane); await frames(2); };
    const mail = async (html) => {
      const built = W.Pneu.renderMailFrame(html, {}, origin, {});
      const loaded = new Promise((r) => { built.frame.addEventListener('load', r, { once: true }); setTimeout(r, 3000); });
      article.querySelector('.body').replaceChildren(built.frame);
      await loaded;
      await frames(3); // sizing
      return built.frame;
    };
    const labels = () => [...D.querySelectorAll('#hints .hint')];
    const type = (s) => { for (const ch of s) A.pendingKey(key(ch)); };

    // Every chip the corpus yields, drawn with the shipping CSS: only the
    // chip's own elements reach this document, the sender's strings as text.
    await check('app-chip-sinks', async (fails) => {
      const OWN = { BUTTON: ['class', 'type', 'tabindex'], KBD: [], BDI: ['class'], SPAN: ['class'] };
      const withAction = runs.filter((r) => r.action);
      if (!withAction.some((r) => r.c.id.startsWith('46'))) fails.push('case 46 yielded no action to draw');
      const long = { url: 'https://' + 'sub'.repeat(20) + '.' + 'a'.repeat(40) + '.example/x', name: 'Review the quarterly numbers before Thursday’s meeting' };
      const actions = withAction.map((r) => [r.c.id, r.action]).concat([['long-destination', long]]);
      for (const [id, action] of actions) {
        const c = A.chip(action, () => {});
        if (!c) { fails.push(id + ': no chip'); continue; }
        header.replaceChildren(from, c);
        for (const n of [c, ...c.querySelectorAll('*')]) {
          const ok = OWN[n.tagName];
          if (!ok) { fails.push(id + ': element ' + n.localName + ' in the chip'); continue; }
          for (const a of n.attributes) if (!ok.includes(a.name)) fails.push(id + ': attribute ' + n.localName + '[' + a.name + ']');
        }
        if (header.querySelector('img, svg, math, script, iframe, object, embed, style, link')) fails.push(id + ': markup in the header');
        const name = c.querySelector('bdi.name');
        if (name && name.textContent !== A.visible(action.name)) fails.push(id + ': name drawn as ' + JSON.stringify(name.textContent));
        if (id.startsWith('46') && !c.textContent.includes('<img src=x onerror=')) fails.push(id + ': the markup is not shown as text');
        // The destination never overflows the pane, at a wide and a narrow width.
        for (const w of [600, 180]) {
          pane.style.width = w + 'px';
          await frames(1);
          const cr = c.getBoundingClientRect(), hr = header.getBoundingClientRect();
          const dest = c.querySelector('.dest'), dr = dest.getBoundingClientRect();
          if (cr.right > hr.right + 0.5) fails.push(id + '@' + w + ': chip ' + box(cr) + ' past its header ' + box(hr));
          if (!within(dr, cr)) fails.push(id + '@' + w + ': destination ' + box(dr) + ' outside the chip ' + box(cr));
          if (dest.scrollWidth > dest.clientWidth + 1) fails.push(id + '@' + w + ': destination clipped');
          if (c.scrollWidth > c.clientWidth + 1) fails.push(id + '@' + w + ': chip overflows');
          if (pane.scrollWidth > pane.clientWidth + 1) fails.push(id + '@' + w + ': pane scrolls sideways');
          if (id === 'long-destination' && w === 180) {
            const line = parseFloat(W.getComputedStyle(dest).lineHeight) || 20;
            if (!(dr.height > line * 1.5)) fails.push('long destination did not wrap: height ' + dr.height);
            if (!(name.clientWidth < name.scrollWidth || name.clientWidth === 0)) fails.push('long destination: the name did not give way');
          }
        }
        pane.style.width = '';
      }
      header.replaceChildren(from);
      if (W.__pwned !== undefined) fails.push('pwned in the app document: ' + W.__pwned);
    });

    // o opens only a chip that is in view; scrolled away, the first o
    // brings it into view and a later, separate o opens.
    await check('app-o-reveal', async (fails) => {
      const action = { url: 'https://github.com/northwind/app/pull/4821', name: 'View Pull Request' };
      const c = A.chip(action, () => {});
      header.replaceChildren(from, c);
      await mail('<!DOCTYPE html><html><head></head><body><p class="canary">o</p></body></html>');
      await scrollPane(0);
      opens.length = 0;
      let got = A.primary(c, key('o'), bounds());
      if (got.act !== 'open' || opens.length !== 1 || opens[0][0] !== action.url) fails.push('in view: ' + got.act + ' ' + JSON.stringify(opens));
      await scrollPane(400);
      opens.length = 0;
      if (within(c.getBoundingClientRect(), bounds())) fails.push('the chip is still in view at scrollTop 400');
      got = A.primary(c, key('o'), bounds());
      if (got.act !== 'reveal' || opens.length) fails.push('out of view: ' + got.act + ', opened ' + opens.length);
      if (!c.classList.contains('reveal')) fails.push('not marked');
      await frames(2);
      if (!within(c.getBoundingClientRect(), bounds())) fails.push('not scrolled into view: ' + box(c.getBoundingClientRect()));
      got = A.primary(c, key('o', { repeat: true }), bounds());
      if (got.act !== 'none' || opens.length) fails.push('a repeat: ' + got.act);
      got = A.primary(c, key('o'), bounds());
      if (got.act !== 'open' || opens.length !== 1 || opens[0][0] !== action.url || opens[0][2] !== 'noopener,noreferrer') {
        fails.push('second o: ' + got.act + ' ' + JSON.stringify(opens));
      }
      header.replaceChildren(from);
    });

    // Hints over hostile positioning: fixed, absolute, transformed, negative
    // margins and huge rects place links outside the frame; the pane is
    // scrolled so rows straddle its top and bottom edges. Every label's
    // whole box lies inside the clip, and 3-letter labels are in play.
    await check('app-hints-positioning', async (fails) => {
      let h = '<!DOCTYPE html><html><head></head><body style="margin:0;font:12px monospace"><p class="canary">hints</p>' +
        '<a href="https://fixed.example/" style="position:fixed;top:-6px;left:-6px;display:block;width:14px;height:14px">f</a>' +
        '<a href="https://right.example/" style="position:absolute;right:0;top:40px;display:block;width:2px;height:12px;background:#888"></a>' +
        '<a href="https://left.example/" style="position:absolute;left:-1000px;top:60px;display:block;width:1002px;height:12px;background:#888">l</a>' +
        '<a href="https://transform.example/" style="display:inline-block;transform:translate(2000px,-40px)">t</a>' +
        '<div style="margin-left:-5000px"><a href="https://margin.example/" style="display:block;width:5001px;height:12px;background:#888">m</a></div>' +
        '<a href="https://huge.example/" style="position:absolute;z-index:-1;left:-50000px;top:-50000px;width:100000px;height:100000px;display:block"></a>';
      for (let i = 0; i < 300; i++) h += '<a href="https://grid.example/' + i + '" style="display:inline-block;width:52px;height:14px;margin:2px">g' + i + '</a>';
      const frame = await mail(h + '</body></html>');
      await scrollPane(100);
      // Slivers on each edge of what shows: 2px of a link at the pane's top
      // and bottom, and at the frame's left and right.
      const fr = frame.getBoundingClientRect(), b = bounds();
      const vTop = b.top - fr.top, vBottom = b.bottom - fr.top;
      const fdoc = frame.contentDocument, body = Object.getOwnPropertyDescriptor(Document.prototype, 'body').get.call(fdoc);
      const slivers = {
        'https://top.example/': 'left:200px;top:' + (vTop - 10) + 'px;width:60px;height:12px',
        'https://bottom.example/': 'left:300px;top:' + (vBottom - 2) + 'px;width:60px;height:12px',
        'https://left.example/edge': 'left:0;top:' + (vTop + 100) + 'px;width:2px;height:12px',
        'https://right.example/edge': 'right:0;top:' + (vTop + 140) + 'px;width:2px;height:12px',
      };
      for (const [href, pos] of Object.entries(slivers)) {
        const a = fdoc.createElement('a');
        a.setAttribute('href', href);
        a.setAttribute('style', 'position:absolute;display:block;z-index:10;background:#888;' + pos);
        body.appendChild(a);
      }
      await frames(2);
      const ctx = hintCtx(frame);
      A.hints(ident, key('L'), ctx);
      if (!A.hintsOpen()) { fails.push('hints did not open: ' + flashes.slice(-1)); return; }
      const ov = D.getElementById('hints').getBoundingClientRect();
      if (!within(ov, ctx.bounds)) fails.push('overlay ' + box(ov) + ' outside the bounds ' + box(ctx.bounds));
      const ls = labels();
      if (ls.length < 82) fails.push('only ' + ls.length + ' labels');
      const rects = new Map(ls.map((l) => [l, l.getBoundingClientRect()]));
      for (const l of ls) {
        const r = rects.get(l);
        if (l.textContent.length !== 3) fails.push('label ' + l.textContent);
        if (!(r.width > 0 && r.height > 0)) fails.push('label ' + l.textContent + ' has no box');
        if (!within(r, ov) || !within(r, ctx.bounds)) fails.push('label ' + l.textContent + ' ' + box(r) + ' outside ' + box(ov));
      }
      // Which link each label stands for: select each, read the status line.
      const byURL = {};
      for (const l of ls) {
        type(l.textContent);
        const u = statusEl.querySelector('bdi.url');
        if (u) byURL[u.textContent] = l;
      }
      for (const href of Object.keys(slivers)) {
        const l = byURL[href];
        if (!l) { fails.push('no label for the sliver ' + href); continue; }
        const r = rects.get(l);
        if (!within(r, ov)) fails.push('sliver ' + href + ' label ' + box(r) + ' outside ' + box(ov));
      }
      A.pendingKey(key('Escape'));
      if (A.hintsOpen()) fails.push('Escape did not close');
    });

    // The label → URL map is frozen when hints open: re-pointing the
    // anchors afterwards changes nothing that opens.
    await check('app-hints-frozen-url', async (fails) => {
      const frame = await mail('<!DOCTYPE html><html><head></head><body><p class="canary">frozen</p>' +
        '<p><a href="https://one.example/a">one</a> <a href="https://two.example/b">two</a> <a href="mailto:x@y.example">mail</a></p></body></html>');
      await scrollPane(0);
      A.hints(ident, key('L'), hintCtx(frame));
      if (!A.hintsOpen()) { fails.push('hints did not open'); return; }
      const first = labels()[0].textContent;
      type(first);
      const shown = statusEl.querySelector('bdi.url');
      if (!shown || shown.textContent !== 'https://one.example/a') fails.push('status shows ' + (shown && shown.textContent));
      const root = Object.getOwnPropertyDescriptor(Document.prototype, 'documentElement').get.call(frame.contentDocument);
      for (const a of root.querySelectorAll('a')) a.setAttribute('href', 'https://evil.example/');
      opens.length = 0;
      A.pendingKey(key('Enter', { shiftKey: true }));
      if (opens.length || !A.hintsOpen()) fails.push('Shift+Enter acted');
      A.pendingKey(key('Enter'));
      if (opens.length !== 1 || opens[0][0] !== 'https://one.example/a') fails.push('opened ' + JSON.stringify(opens));
      if (A.hintsOpen()) fails.push('still open after Enter');
    });

    // A long destination scrolls in the status line, by the pane's scroll
    // (not closing hints) and by the inspection keys (not reaching the app).
    await check('app-hints-status-scroll', async (fails) => {
      const url = 'https://long.example/' + 'x'.repeat(3000);
      const frame = await mail('<!DOCTYPE html><html><head></head><body><p class="canary">long</p><a href="' + url + '">long</a></body></html>');
      await scrollPane(0);
      A.hints(ident, key('L'), hintCtx(frame));

      type(labels()[0].textContent);
      if (!(statusEl.scrollHeight > statusEl.clientHeight)) { fails.push('status line does not scroll'); return; }
      for (const k of ['ArrowDown', 'PageDown', 'End', 'Home', 'PageUp']) {
        const e = key(k), before = statusEl.scrollTop;
        const taken = A.pendingKey(e);
        if (!taken || !e.prevented) fails.push(k + ' reached the app');
        scrolled(statusEl);
        await frames(2);
        if (!A.hintsOpen()) { fails.push(k + ' closed hints'); return; }
        const after = statusEl.scrollTop;
        if ((k === 'Home' || k === 'PageUp') ? !(after < before || before === 0) : !(after > before)) fails.push(k + ' scrolled ' + before + '→' + after);

      scrolled(statusEl);
      await frames(2);
      if (!A.hintsOpen()) fails.push('the status line scrolling closed hints');

    });

    await check('app-hints-yield-status', async (fails) => {
      const frame = await mail('<!DOCTYPE html><html><head></head><body><p class="canary">yield</p><a href="https://one.example/">one</a></body></html>');
      A.hints(ident, key('L'), hintCtx(frame));
      if (!A.hintsOpen()) { fails.push('hints did not open'); return; }

      A.yieldStatus();
      if (A.hintsOpen()) fails.push('still open');
      if (statusEl.classList.contains('hint') || statusEl.textContent) fails.push('status line kept the selection');
      opens.length = 0;
      A.pendingKey(key('Enter'));
      if (opens.length) fails.push('Enter opened after the session ended');
    });

    // listener and observer a session adds is gone when it ends.
    await check('app-hints-listeners', async (fails) => {
      const T = { on: false, live: [], obs: [] };
      const html = '<!DOCTYPE html><html><head></head><body><p class="canary">listeners</p><a href="https://one.example/">one</a> <a href="https://two.example/">two</a></body></html>';
      instrument(W, T);
      let frame = await mail(html);
      const ways = ['escape', 'cancel', 'cancelFor', 'pane-scroll', 'resize', 'frame-replaced', 'enter', 'yield'];
      for (let round = 0; round < 3; round++) {
        for (const how of ways) {
          await scrollPane(0);
          instrument(frame.contentWindow, T);
          T.on = true;
          try { A.hints(ident, key('L'), hintCtx(frame)); } finally { T.on = false; }
          if (!A.hintsOpen()) { fails.push(how + ': hints did not open'); continue; }
          if (T.live.length < 4 || T.obs.length !== 1) fails.push(how + ': tracked ' + T.live.length + ' listeners, ' + T.obs.length + ' observers');
          if (how === 'escape') A.pendingKey(key('Escape'));
          else if (how === 'cancel') A.cancel();
          else if (how === 'cancelFor') A.cancelFor(article);
          else if (how === 'pane-scroll') { pane.scrollTop = 3; scrolled(pane); }
          else if (how === 'resize') W.dispatchEvent(new W.Event('resize'));
          else if (how === 'frame-replaced') {
            // A new document in the same frame, with no cancelFor.
            const loaded = new Promise((r) => { frame.addEventListener('load', r, { once: true }); setTimeout(r, 3000); });
            W.Pneu.renderMailFrame(html, {}, origin, { frame });
            await loaded;
          } else if (how === 'enter') { type(labels()[0].textContent); A.pendingKey(key('Enter')); }

    await check('app-guess-repoint', async (fails) => {

      let { g, c } = fresh();

      W.Pneu.renderMailFrame(r56.html, {}, origin, { frame });
      await loaded;
      got = o(again);

    // The guess's chip (57): marked as a guess, the text the sender wrote as
    // the name, the destination the href's host (not the paypal.com the
    // text names); its highlight is drawn in this document over the link,
    // inside the frame's box, and the frame's document is untouched.
    await check('app-guess-chip', async (fails) => {
      const r57 = runs.find((r) => r.c.id.startsWith('57'));

      const before = froot.outerHTML;
      const g = A.guess(frame);
      if (!g.action) { fails.push('no guess'); return; }
      const c = A.chip(g.action, () => {});

      const OWN = { BUTTON: ['class', 'type', 'tabindex'], KBD: [], BDI: ['class'], SPAN: ['class'] };
      for (const n of [c, ...c.querySelectorAll('*')]) {

      m.sync();

      await frames(1);
      if (m.el.ownerDocument !== D || !holder.contains(m.el)) fails.push('the mark is not in the app document');

      if (!within(lr, clip) || !within(clip, lr)) fails.push('mark layer ' + box(lr) + ' is not the frame\'s box ' + box(clip));
      if (W.getComputedStyle(m.el).overflow !== 'hidden') fails.push('mark layer does not clip');

      if (['left', 'top', 'right', 'bottom'].some((k) => Math.abs(br[k] - want[k]) > 1)) fails.push('mark ' + box(br) + ' is not over the link ' + box(want));
      if (froot.outerHTML !== before) fails.push('the frame document changed');
      // Stale highlights hide: re-validated at most every 250ms while it
      // shows, it hides when the link moves with nothing to follow, stops
      // showing, or goes; the next update (a resize) shows it again.
      const link = g.action.guess.anchor;
      for (const [how, change, undo] of [
        ['moved', () => { link.style.marginLeft = '40px'; }, () => { link.style.marginLeft = ''; }],

      link.style.marginLeft = '40px';
      await sleep(400);
      if (pending.size || m.timing()) fails.push('a hidden mark kept its timer');
      link.style.marginLeft = '';
      m.update();
      article.classList.remove('selected');
      m.sync();
      if (pending.size || m.timing()) fails.push('the timer outlived the cursor: ' + pending.size);
      link.style.marginLeft = '40px';
      await sleep(400);
      if (m.el.hidden) fails.push('the mark was re-validated off the cursor message');
      link.style.marginLeft = '';
      article.classList.add('selected');
      m.sync();
      if (m.el.hidden || pending.size !== 1) fails.push('sync did not re-validate and restart on the cursor: ' + pending.size);
      // Off the cursor with no sync, the timer stops by itself.
      article.classList.remove('selected');
      await sleep(400);
      if (pending.size || m.timing()) fails.push('the timer kept running off the cursor without a sync');
      article.classList.add('selected');
      m.sync();

      const realCS = W.getComputedStyle;
      W.getComputedStyle = function (el) { if (el && el.ownerDocument !== D) throw new Error('forced'); return realCS.apply(W, arguments); };
      await sleep(400);
      W.getComputedStyle = realCS;
      if (!m.el.hidden || pending.size || m.timing()) fails.push('a throw in re-validation left it ' + (m.el.hidden ? 'hidden' : 'shown') + ' with ' + pending.size + ' timers');
      m.update();
      if (m.el.hidden || pending.size !== 1) fails.push('the mark did not come back after the throw');
      link.remove();
      await sleep(400);
      if (!m.el.hidden) fails.push('the mark stayed on a removed link');
      frame.contentDocument.body.appendChild(link);
      m.update();
      article.classList.remove('selected');
      if (W.getComputedStyle(m.el).display !== 'none') fails.push('the mark shows off the cursor message');
      m.stop();
      if (pending.size) fails.push('a timer outlived stop');
      W.setTimeout = realSet;
      W.clearTimeout = realClear;
      if (holder.querySelector('.cta-mark')) fails.push('the mark stayed after stop');
      header.replaceChildren(from);
    });

    app.remove();

    // DOMPurify's hooks are global: the capture hook is gone even when the
    // sanitize call throws.
    await check('sanitize-throw-hook', async (fails) => {
      const sanitize = DOMPurify.sanitize;
      DOMPurify.sanitize = function () { DOMPurify.sanitize = sanitize; throw new Error('forced'); };
      let threw = false;
      try { Pneu.assembleMailDocument('<p>x</p>', {}, origin, {}); } catch (e) { threw = String(e).includes('forced'); }
      DOMPurify.sanitize = sanitize;
      if (!threw) fails.push('the forced throw did not surface');
      if (DOMPurify.removeHook('uponSanitizeElement')) fails.push('hook left installed after a throw');
      const gh = runs.find((r) => r.c.id.startsWith('53'));
      if (gh && !Pneu.assembleMailDocument(gh.html, {}, origin, {}).action) fails.push('assembly broken after the throw');
    });

    // The capture hook only reads: with it and without it, the sanitized
    // document is byte-identical for every case.
    await check('sanitize-hook-identical', async (fails) => {
      const addHook = DOMPurify.addHook;
      for (const r of runs) {
        const c = r.c;

        const a = Pneu.assembleMailDocument(r.html, c.cids || {}, origin, opts);

        if (a.srcdoc !== again.srcdoc) { fails.push(c.id + ': assembly is not deterministic'); continue; }

        if (a.srcdoc !== b.srcdoc || a.csp !== b.csp) fails.push(c.id + ': differs with the hook installed');
        if (b.ldBlocks !== 0) fails.push(c.id + ': captured without the hook');
      }
    });
    return results;
  }

  // instrument records, while T.on, each listener and ResizeObserver added
  // in win's realm, and forgets it when removed or disconnected.
  function instrument(win, T) {
    if (win.__pneuTracked) return;
    win.__pneuTracked = true;
    const P = win.EventTarget.prototype, add = P.addEventListener, rem = P.removeEventListener;
    const cap = (o) => typeof o === 'boolean' ? o : !!(o && o.capture);
    const find = (t, type, f, o) => T.live.findIndex((x) => x[0] === t && x[1] === type && x[2] === f && x[3] === cap(o));
    P.addEventListener = function (type, f, o) {
      if (T.on && find(this, type, f, o) < 0) T.live.push([this, type, f, cap(o)]);
      return add.call(this, type, f, o);
    };
    P.removeEventListener = function (type, f, o) {
      const i = find(this, type, f, o);
      if (i >= 0) T.live.splice(i, 1);
      return rem.call(this, type, f, o);
    };
    const RP = win.ResizeObserver.prototype, observe = RP.observe, disconnect = RP.disconnect;
    RP.observe = function () { if (T.on && !T.obs.includes(this)) T.obs.push(this); return observe.apply(this, arguments); };
    RP.disconnect = function () { const i = T.obs.indexOf(this); if (i >= 0) T.obs.splice(i, 1); return disconnect.apply(this, arguments); };
  }

  // ---- app.js on the thread page ---------------------------------------------
  // The shipping app.js on the thread page the server renders
  // (app-thread.html: base.html and thread.html, kept current by

  // Keys are dispatched where a keystroke lands: the thread pane, and the
  // mail frame's document.
  async function pageChecks() {
    const results = [];
    const pageHTML = await (await fetch('app-thread.html')).text();
    const host = 'notifications.' + 'a'.repeat(60) + '.' + 'b'.repeat(60) + '.example';

      mail += '<a href="https://grid.example/' + i + '/' + 'x'.repeat(300) + '" style="display:inline-block;width:64px;margin:3px">link ' + i + '</a>';
    }
    mail += '</body></html>';
    const bodies = { '/body/personal/h2@hostile.test': { html: mail, cids: {} } };
    for (const layout of ['narrow', 'split']) {
      const P = await threadPage(pageHTML, layout, bodies);
      const check = async (id, fn) => {
        const fails = [];
        out.textContent = 'pending: page-' + layout + '-' + id;
        try { if (P.error) throw new Error(P.error); await fn(fails); } catch (e) { fails.push('harness error: ' + (e && e.stack || e)); }
        results.push({ id: 'page-' + layout + '-' + id, pass: fails.length === 0, fails });
      };

      await check('layout', async (fails) => {
        if (D.body.classList.contains('split') !== (layout === 'split')) fails.push('body.split=' + D.body.classList.contains('split'));
        if (W.__errors.length) fails.push('page errors: ' + W.__errors.join(' | '));
      });
      if (P.error) { P.frame.remove(); continue; }
      const A = W.Pneu.actions;
      const calls = [];
      const primary = A.primary;
      A.primary = function () { const r = primary.apply(this, arguments); calls.push(r); return r; };
      const pane = D.querySelector('main.thread');
      const article = D.querySelector('article.message[data-msgid="h2@hostile.test"]');
      const chip = () => article.querySelector(':scope > header > .cta');
      const mframe = article.querySelector('iframe.mail');
      const scroller = layout === 'split' ? pane : D.scrollingElement;
      // The chrome a chip can sit half under: the split's sticky title, and
      // narrow, the fixed key bar (the page header is sticky in app.css but
      // doesn't stick there: body, overflow-x:hidden, is its scroll
      // container and never scrolls).
      const chrome = layout === 'split' ? D.querySelector('main.thread > h1') : D.getElementById('keybar');
      const statusEl = D.getElementById('status');
      const press = (target, key, extra) => {
        const o = Object.assign({ key, code: key.length === 1 ? 'Key' + key.toUpperCase() : key, bubbles: true, cancelable: true }, extra);
        target.dispatchEvent(new W.KeyboardEvent('keydown', o));
        target.dispatchEvent(new W.KeyboardEvent('keyup', o));
      };
      const frameBody = () => Object.getOwnPropertyDescriptor(Document.prototype, 'body').get.call(mframe.contentDocument);
      const reset = () => { calls.length = 0; W.__opens.length = 0; };

      // A chip whose top row is behind the sticky chrome and whose centre is
      // below it: o reveals it (the chrome is out of the bounds), and only
      // the o after that opens.
      await check('o-under-chrome', async (fails) => {
        const c = chip();
        if (!c) { fails.push('no chip'); return; }
        const cr0 = c.getBoundingClientRect();
        if (layout === 'narrow' && !(c.querySelector('.dest').getBoundingClientRect().height > 30)) fails.push('the chip does not wrap: ' + cr0.height);
        // Split: the top row behind the title, the centre below it. Narrow:
        // the bottom row behind the key bar, the centre above it; the chip
        // is near the top of the page, so the window is made short enough.
        if (layout === 'split') scroller.scrollTop += cr0.top - (chrome.getBoundingClientRect().bottom - 0.35 * cr0.height);
        else {

          const r = c.getBoundingClientRect();

        }
        const cr = c.getBoundingClientRect(), mid = (cr.top + cr.bottom) / 2, hr = chrome.getBoundingClientRect();
        const half = layout === 'split' ? cr.top < hr.bottom && hr.bottom < mid : mid < hr.top && hr.top < cr.bottom;

        else if (calls[0].act !== 'reveal' || calls[0].why !== 'bounds') fails.push('first o: ' + JSON.stringify(calls[0]));
        if (W.__opens.length) fails.push('first o opened ' + W.__opens[0][0]);
        press(pane, 'o');
        if (W.__opens.length !== 1 || W.__opens[0][0] !== actionURL) fails.push('second o opened ' + JSON.stringify(W.__opens));
        P.frame.style.height = '560px';
      });

      // Anything else over part of the chip (here its top row, its centre
      // clear) keeps o from opening it.
      await check('o-covered', async (fails) => {
        const c = chip();
        c.scrollIntoView({ block: 'center' });
        const r = c.getBoundingClientRect();
        const lid = D.createElement('div');
        lid.style.cssText = 'position:fixed;z-index:5;background:#000;left:' + r.left + 'px;top:' + r.top + 'px;width:' + r.width + 'px;height:' + (r.height * 0.3) + 'px';
        article.appendChild(lid); // not app chrome (a body child): a stranger over the chip
        reset();
        press(pane, 'o');
        if (calls.length !== 1 || calls[0].act !== 'reveal' || calls[0].why !== 'covered') fails.push('o with the top row covered: ' + JSON.stringify(calls));
        if (W.__opens.length) fails.push('opened under the cover');
        lid.remove();
        c.scrollIntoView({ block: 'center' });
        press(pane, 'o');
        if (W.__opens.length !== 1) fails.push('uncovered, o did not open');
      });

      // The same from inside the mail frame, the chip scrolled away above.
      await check('o-from-frame', async (fails) => {
        const c = chip();
        scroller.scrollTop += c.getBoundingClientRect().bottom + 600;
        if (c.getBoundingClientRect().bottom > 0) { fails.push('the chip did not scroll away'); return; }
        reset();
        press(frameBody(), 'o');
        if (calls.length !== 1 || calls[0].act !== 'reveal') fails.push('o in the frame: ' + JSON.stringify(calls));
        if (W.__opens.length) fails.push('o in the frame opened ' + W.__opens[0][0]);
        press(frameBody(), 'o');
        if (W.__opens.length !== 1 || W.__opens[0][0] !== actionURL) fails.push('second o in the frame opened ' + JSON.stringify(W.__opens));
      });

      // Link hints: with a label selected, the status line shows the
      // destination and nothing paints over it; a flash from elsewhere
      // ends the session, and Enter then opens nothing.
      await check('hints-status', async (fails) => {
        scroller.scrollTop += mframe.getBoundingClientRect().top + 200;
        reset();
        press(pane, 'L', { shiftKey: true });
        if (!A.hintsOpen()) { fails.push('L did not open hints'); return; }
        // The lowest label: the status line, lifted over the key bar with
        // the selection, reaches it.
        const labels = [...D.querySelectorAll('#hints .hint')];
        // (the status line sits at the right: the rightmost of the lowest row).
        const bottom = Math.max(...labels.map((l) => l.getBoundingClientRect().bottom));
        const lowest = labels.filter((l) => l.getBoundingClientRect().bottom > bottom - 20)
          .reduce((a, b) => (b.getBoundingClientRect().right > a.getBoundingClientRect().right ? b : a));
        for (const ch of lowest.textContent) press(pane, ch);
        const url = statusEl.querySelector('bdi.url');
        if (!url || !url.textContent.startsWith('https://grid.example/')) { fails.push('no destination on the status line'); return; }
        const sr = statusEl.getBoundingClientRect();
        const meets = (r) => r.right > sr.left && r.left < sr.right && r.bottom > sr.top && r.top < sr.bottom;
        if (!lowest.classList.contains('under')) fails.push('the selected label ' + lowest.textContent + ' was not hidden under the status line');
        for (const l of labels) {
          if (W.getComputedStyle(l).display !== 'none' && meets(l.getBoundingClientRect())) fails.push('label ' + l.textContent + ' over the status line');
        }
        // Stacking: every label shown and hit-testable, those that meet the
        // status line still lie under it.
        const ov = D.getElementById('hints');
        const classes = labels.map((l) => l.className);
        ov.style.pointerEvents = 'auto';
        labels.forEach((l) => { l.className = 'hint'; });
        const met = labels.filter((l) => meets(l.getBoundingClientRect()));
        if (!met.length) fails.push('no label meets the status line: the stacking check tests nothing');
        for (const l of met) {
          const r = l.getBoundingClientRect();
          const x = (Math.max(r.left, sr.left) + Math.min(r.right, sr.right)) / 2;
          const y = (Math.max(r.top, sr.top) + Math.min(r.bottom, sr.bottom)) / 2;
          const hit = D.elementFromPoint(x, y);
          if (!hit || !statusEl.contains(hit)) { fails.push('label ' + l.textContent + ' paints over the status line'); break; }
        }
        labels.forEach((l, i) => { l.className = classes[i]; });
        ov.style.pointerEvents = '';
        W.Pneu.flash('Sync failed: harness', 'error');
        if (A.hintsOpen()) fails.push('a flash left hints up');
        if (statusEl.textContent !== 'Sync failed: harness') fails.push('status line: ' + statusEl.textContent.slice(0, 80));
        if (D.getElementById('hints')) fails.push('overlay left');
        press(pane, 'Enter');
        if (W.__opens.length) fails.push('Enter opened ' + W.__opens[0][0]);
      });
      if (W.__pwned !== undefined || window.__pwned !== undefined) results.push({ id: 'page-' + layout + '-pwned', pass: false, fails: ['pwned'] });
      P.frame.remove();
    }
    return results;
  }

  // The button heuristic through app.js on the thread page (narrow): a
  // body with no JSON-LD gets a guess chip once its frame has laid out, the
  // link is highlighted on the cursor message only, o opens it, and after
  // its href changes o opens nothing and the chip is guessed afresh, now
  // showing where the link goes.
  async function guessPageChecks() {
    const results = [];
    const pageHTML = await (await fetch('app-thread.html')).text();
    const html = await (await fetch('56-cta-repoint.html')).text();
    const P = await threadPage(pageHTML, 'narrow', { '/body/personal/h2@hostile.test': { html, cids: {} } });
    const fails = [];
    out.textContent = 'pending: page-guess';
    try {
      if (P.error) throw new Error(P.error);
      const { W, D } = P;
      const article = D.querySelector('article.message[data-msgid="h2@hostile.test"]');
      const pane = D.querySelector('main.thread');
      const chip = () => article.querySelector(':scope > header > .cta');
      const mframe = article.querySelector('iframe.mail');
      const statusEl = D.getElementById('status');
      const press = (target, k) => {
        const o = { key: k, code: 'Key' + k.toUpperCase(), bubbles: true, cancelable: true };
        target.dispatchEvent(new W.KeyboardEvent('keydown', o));
        target.dispatchEvent(new W.KeyboardEvent('keyup', o));
      };
      const want = 'https://reset.example/token/56';
      if (!chip().classList.contains('guess')) fails.push('the chip is not a guess');
      if (!article.classList.contains('selected')) fails.push('the message is not the cursor');
      const mk = article.querySelector('.body .cta-mark');
      if (!mk || mk.hidden || W.getComputedStyle(mk).display === 'none') fails.push('no highlight on the cursor message');
      else {
        const fr = mframe.getBoundingClientRect(), br = mk.firstChild.getBoundingClientRect();
        const ar = mframe.contentDocument.querySelector('a[href="' + want + '"]').getBoundingClientRect();
        if (Math.abs(br.left - (fr.left + mframe.clientLeft + ar.left)) > 1 || Math.abs(br.top - (fr.top + mframe.clientTop + ar.top)) > 1) fails.push('highlight not over the link');
      }
      chip().scrollIntoView({ block: 'center' });
      W.__opens.length = 0;
      press(pane, 'o');
      if (W.__opens.length !== 1 || W.__opens[0][0] !== want) fails.push('o opened ' + JSON.stringify(W.__opens));
      const a = mframe.contentDocument.querySelector('a[href="' + want + '"]');
      a.setAttribute('href', 'https://evil.example/56');
      W.__opens.length = 0;
      press(pane, 'o');
      if (W.__opens.length) fails.push('o opened the re-pointed link: ' + W.__opens[0][0]);
      if (!/^Not opened: the link changed/.test(statusEl.textContent)) fails.push('status: ' + statusEl.textContent);
      const d = chip() && chip().querySelector('bdi.destination');
      if (!d || d.textContent !== 'https://evil.example') fails.push('the chip was not guessed afresh: ' + (d && d.textContent));
      // Off the cursor, no highlight and no re-validation timer.
      if (W.__timers250.size !== 1) fails.push('re-validation timers on the cursor message: ' + W.__timers250.size);
      press(pane, 'p');
      if (W.__timers250.size) fails.push('re-validation timers after the cursor left: ' + W.__timers250.size);
      const mk2 = article.querySelector('.body .cta-mark');
      if (article.classList.contains('selected')) fails.push('p did not move the cursor');
      else if (mk2 && W.getComputedStyle(mk2).display !== 'none') fails.push('the highlight shows off the cursor message');
      if (W.__errors.length) fails.push('page errors: ' + W.__errors.join(' | '));
    } catch (e) { fails.push('harness error: ' + (e && e.stack || e)); }
    results.push({ id: 'page-narrow-guess', pass: fails.length === 0, fails });
    P.frame.remove();

    // A throw inside the heuristic (forced: the first computed style of a
    // link in the frame) is no pick, cleanly: the body still renders, no
    // chip, no highlight, no timer, nothing reaches the page's errors.
    const tfails = [];
    out.textContent = 'pending: page-guess-throw';
    const T2 = await threadPage(pageHTML, 'narrow', { '/body/personal/h2@hostile.test': { html, cids: {} } }, { throwOnce: true, noChip: true });
    try {
      if (T2.error) throw new Error(T2.error);
      await sleep(300);
      const { W, D } = T2;
      const article = D.querySelector('article.message[data-msgid="h2@hostile.test"]');
      const div = article.querySelector('.body[data-kind=html]');
      if (W.__threw !== 1) tfails.push('the forced throw did not happen: ' + W.__threw);
      if (!div || div.dataset.state !== 'done') tfails.push('the body did not finish rendering: ' + (div && div.dataset.state));
      if (article.querySelector(':scope > header > .cta')) tfails.push('a chip after the throw');
      if (article.querySelector('.cta-mark')) tfails.push('a highlight after the throw');
      if (W.__timers250.size) tfails.push('timers after the throw: ' + W.__timers250.size);
      if (W.__errors.length) tfails.push('page errors: ' + W.__errors.join(' | '));
    } catch (e) { tfails.push('harness error: ' + (e && e.stack || e)); }
    results.push({ id: 'page-narrow-guess-throw', pass: tfails.length === 0, fails: tfails });
    T2.frame.remove();

    const plain = { '/body/personal/h2@hostile.test': { html, cids: {} } };
    for (const layout of ['narrow', 'split']) results.push(await viewChecks(pageHTML, plain, layout));
    results.push(await pushChecks(pageHTML, plain));
    return results;
  }

  // viewChecks: the page's side of the view generation (app.js onView,
  // docs/client.md "Changes from other windows"). The page is labeled
  // epoch e1, gen 1; events are dispatched on its stream, and its thread
  // URL answers with the same page, labeled at W.__serverGen.
  async function viewChecks(pageHTML, bodies, layout) {
    const fails = [];
    const id = 'page-' + layout + '-view';
    out.textContent = 'pending: ' + id;
    // The thread's own URL, which a srcdoc page's is: srcdoc.
    const epoch = '00000000000000e1', thread = '00000000000000a1', url = 'srcdoc';
    const named = [{ account: 'personal', thread }];
    const other = 'fedcba9876543210fedcba9876543210';
    const P = await threadPage(pageHTML, layout, bodies, {
      pages: { [url]: pageHTML },
      tag: { ok: true, action: 'star', id: 'ab12', account: 'personal', ids: ['h2%40hostile.test'], changes: ['+flagged'], epoch, gen: 7 },
      noChip: true,
    });
    try {
      if (P.error) throw new Error(P.error);
      const { W, D } = P;
      const refetches = () => W.__fetches.filter((f) => f.url === url).length;
      const send = (name, data) => W.__es.listeners[name]({ data: JSON.stringify(data) });
      const view = (gen, from, threads) => { W.__serverGen = gen; send('view', { epoch, gen, from, threads }); };
      const press = (target, key) => {
        const o = { key, code: 'Key' + key.toUpperCase(), bubbles: true, cancelable: true };
        target.dispatchEvent(new W.KeyboardEvent('keydown', o));
        target.dispatchEvent(new W.KeyboardEvent('keyup', o));
      };
      if (!W.__es || !W.__es.listeners.view || !W.__es.listeners.hello) throw new Error('no view/hello listeners');

      send('hello', { epoch, gen: 1, accounts: [] });
      await sleep(100);
      if (refetches()) fails.push('hello at the page\'s own label refetched the thread');

      // Another window's write naming the open thread: fetched again in
      // place, the cursor message kept.
      const before = D.querySelector('main.thread');
      view(2, other, named);
      await sleep(400);
      const pane = D.querySelector('main.thread');
      if (refetches() !== 1) fails.push('refetches after a view naming the thread: ' + refetches());
      if (pane === before) fails.push('the thread was not re-rendered');
      const sel = pane.querySelector('article.message.selected');
      if (!sel || sel.dataset.msgid !== 'h2@hostile.test') fails.push('cursor after the refetch: ' + (sel && sel.dataset.msgid));

      // One naming another thread: the thread stays.
      view(3, other, [{ account: 'work', thread }]);
      await sleep(200);
      if (refetches() !== 1) fails.push('refetched for another thread');

      // This window's own write, applied from its answer: skipped. The
      // write carried the window id.
      press(pane, 's');
      await sleep(200);
      const post = W.__fetches.find((f) => f.url === '/tag');
      const wid = post && post.headers['X-Pneu-Window'];
      if (!/^[0-9a-f]{32}$/.test(wid || '')) fails.push('POST /tag without a window id: ' + wid);
      view(7, wid, named);
      await sleep(200);
      if (refetches() !== 1) fails.push('refetched for its own applied write');
      // Its own id on a write it never applied: reconciled.
      view(8, wid, named);
      await sleep(400);
      if (refetches() !== 2) fails.push('own id, unapplied write: refetches ' + refetches());

      // In the middle of something (a dialog): marked, then refetched once
      // it closes. The undo toast says another window wrote the thread.
      press(D.querySelector('main.thread'), '?');
      const help = D.getElementById('keys');
      if (!help || !help.open) throw new Error('? opened no dialog');
      view(9, other, named);
      await sleep(200);
      if (refetches() !== 2) fails.push('refetched under an open dialog');
      if (!('changed' in D.querySelector('main.thread').dataset)) fails.push('not marked changed elsewhere');
      const status = D.getElementById('status').textContent;
      if (!status.startsWith('changed elsewhere · z undoes yours anyway')) fails.push('undo toast: ' + status);
      help.close();
      await sleep(1500);
      if (refetches() !== 3) fails.push('no refetch once the dialog closed: ' + refetches());
      if ('changed' in D.querySelector('main.thread').dataset) fails.push('still marked after the refetch');
      if (W.__errors.length) fails.push('page errors: ' + W.__errors.join(' | '));
    } catch (e) { fails.push('harness error: ' + (e && e.stack || e)); }
    P.frame.remove();
    return { id, pass: fails.length === 0, fails };
  }

  // pushChecks: the sync details' instant mail lines and polling note
  // (docs/push.md D7) on the shipping app.js. Push health, hostile values
  // included, arrives by hello and `account`; the details draw it as text
  // (only the details' own elements, no attributes but their classes) and
  // the status line never moves with it.
  async function pushChecks(pageHTML, bodies) {
    const fails = [];
    const id = 'page-push-details';
    out.textContent = 'pending: ' + id;
    const P = await threadPage(pageHTML, 'narrow', bodies, { noChip: true });
    try {
      if (P.error) throw new Error(P.error);
      const { W, D } = P;
      const send = (name, data) => W.__es.listeners[name]({ data: JSON.stringify(data) });
      const evil = '<img src=x onerror="top.__pwned=\'push\'">';
      const synced = new Date(Date.now() - 60000).toISOString();
      const delivered = new Date(Date.now() - 125000).toISOString().replace(/\.\d+Z$/, 'Z');
      const acct = (name, push, pollEvery) => Object.assign({ name, state: 'ready', pulled: true, failures: 0, error: null, authing: false,
        progress: null, lastSync: synced, queued: false, running: false, pollEvery }, push === undefined ? {} : { push });
      const sync = D.getElementById('sync');
      const line = () => sync.dataset.state + '|' + sync.textContent + '|' + sync.className + '|' + sync.getAttribute('aria-label');
      // Account names Object.prototype has are valid names (config.ValidName).
      send('hello', { epoch: '00000000000000e1', gen: 1, accounts: [acct('personal', undefined, 30), acct('constructor', { state: 'delivering', lastDelivery: delivered }, 30)] });
      const base = line();
      if (!/^fresh\|Updated 1m ago/.test(base)) fails.push('status line before push: ' + base);
      const pushes = [{ state: 'reauth', reason: 'owner-reauth' }, { state: 'failing', reason: 'permission' }, { state: evil, reason: evil, lastDelivery: evil },
        { state: 'failing', reason: evil }];
      for (const push of pushes) {
        send('account', acct('personal', push, 240));
        if (line() !== base) fails.push('push ' + JSON.stringify(push) + ' moved the status line: ' + line());
      }
      sync.click();
      const dlg = D.getElementById('syncinfo');
      const check = (want, code) => {
        if (!dlg || !dlg.open) { fails.push('no details dialog'); return; }
        const allowed = { DIV: 1, H2: 1, DL: 1, DT: 1, DD: 1, BR: 1, SPAN: 1, CODE: 1, P: 1, KBD: 1 };
        for (const n of dlg.querySelectorAll('*')) {
          if (!allowed[n.tagName]) fails.push('element ' + n.tagName + ' in the details');
          for (const at of n.attributes) if (at.name !== 'class') fails.push('attribute ' + at.name + ' in the details');
        }
        const text = dlg.textContent;
        for (const w of want) if (!text.includes(w)) fails.push('details lack ' + JSON.stringify(w) + ': ' + text);
        for (const w of ['<img', 'onerror', 'function', 'native code']) if (text.includes(w)) fails.push('details show ' + JSON.stringify(w) + ': ' + text);
        const codes = [...dlg.querySelectorAll('code')].map((c) => c.textContent);
        if (JSON.stringify(codes) !== JSON.stringify(code)) fails.push('commands ' + JSON.stringify(codes));
        if (dlg.querySelector('.bad')) fails.push('push drew something red');
      };
      check(['Instant: failing — something went wrong. Run pneu account push personal.', 'Instant: delivering · last message 2m ago',
        'checks every 4m while failing', 'Checks every 30s'], ['pneu account push personal']);
      // Open details follow an `account` event.
      send('account', acct('personal', { state: 'failing', reason: 'network' }, 240));
      check(["Instant: failing — can't reach Google; it keeps trying"], []);
      send('account', acct('personal', { state: 'reauth', reason: 'owner-reauth' }, 30));
      check(["the push owner's Google grant expired or was revoked. Run pneu push init --reconsent."], ['pneu push init --reconsent']);
      send('account', acct('personal', undefined, 30));
      check(['Instant: off'], []);
      if (line() !== base) fails.push('status line after: ' + line());
      if (dlg) dlg.close();
      if (W.top.__pwned !== undefined) fails.push('pwned: ' + W.top.__pwned);
      if (W.__errors.length) fails.push('page errors: ' + W.__errors.join(' | '));
    } catch (e) { fails.push('harness error: ' + (e && e.stack || e)); }
    P.frame.remove();
    return { id, pass: fails.length === 0, fails };
  }

  // threadPage loads app-thread.html into a same-origin frame of the
  // layout's width, the network stood in for (pageShim), and waits for the
  // HTML message's body and chip.
  async function threadPage(html, layout, bodies, options) {
    const f = document.createElement('iframe');
    f.style.cssText = 'position:fixed;left:0;top:0;z-index:20;border:0;background:#fff;height:560px;width:' + (layout === 'split' ? 1400 : 700) + 'px';
    const shim = '<script>(' + pageShim.toString() + ')(' + JSON.stringify(bodies).replace(/</g, '\\u003c') + ', ' + JSON.stringify(options || {}).replace(/</g, '\\u003c') + ')<\/script>';
    if (!html.includes('<head>')) return { frame: f, error: 'app-thread.html has no <head>' };
    f.srcdoc = html.replace('<head>', '<head>' + shim);
    const loaded = new Promise((r) => { f.addEventListener('load', r, { once: true }); setTimeout(r, 3000); });
    document.body.appendChild(f);
    await loaded;
    const W = f.contentWindow, D = f.contentDocument;
    for (let i = 0; i < 100; i++) {
      const a = D.querySelector('article.message[data-msgid="h2@hostile.test"]');
      const fr = a && a.querySelector('iframe.mail');
      if (fr && fr.contentDocument && fr.contentDocument.readyState === 'complete' && (a.querySelector('.cta') || (options && options.noChip)) && fr.getBoundingClientRect().height > 100) {
        return { frame: f, W, D };
      }
      await sleep(50);
    }
    return { frame: f, W, D, error: 'the HTML body or its chip never rendered' + (W.__errors ? ': ' + W.__errors.join(' | ') : '') };
  }

  // pageShim runs in the thread page ahead of its scripts (serialized there).
  function pageShim(bodies, options) {
    window.__errors = [];
    window.addEventListener('error', function (e) { window.__errors.push(String(e.message)); });
    // setTimeout's 250ms timers (the highlight's re-validation), pending.
    var timers = window.__timers250 = new Map(), set = window.setTimeout, clear = window.clearTimeout;
    window.setTimeout = function (f, ms) {
      var args = Array.prototype.slice.call(arguments, 2);
      var id = set.call(window, function () { timers.delete(id); return f.apply(this, args); }, ms);
      if (ms === 250) timers.set(id, true);
      return id;
    };
    window.clearTimeout = function (id) { timers.delete(id); return clear.call(window, id); };
    if (typeof options === 'object' && options && options.throwOnce) {
      // The first computed style asked of a link in a message frame throws.
      var cs = window.getComputedStyle;
      window.__threw = 0;
      window.getComputedStyle = function (el) {
        if (!window.__threw && el && el.ownerDocument !== document && el.localName === 'a') { window.__threw++; throw new Error('forced'); }
        return cs.apply(window, arguments);
      };
    }
    window.__opens = [];
    window.open = function (url, target, features) { window.__opens.push([String(url), target, features]); return null; };
    // The page's event stream: the harness dispatches to its listeners.
    window.EventSource = function () {
      var on = this.listeners = {};
      window.__es = this;
      this.addEventListener = function (name, fn) { on[name] = fn; };
      this.close = function () {};
    };
    // Every request, with its headers. options.pages: our own pages, as
    // text/html, labeled at window.__serverGen; options.tag: POST /tag's
    // answer.
    window.__fetches = [];
    window.fetch = function (url, init) {
      var u = String(url);
      window.__fetches.push({ url: u, headers: (init && init.headers) || {} });
      if (Object.prototype.hasOwnProperty.call(bodies, u)) {
        return Promise.resolve(new Response(JSON.stringify(bodies[u]), { status: 200, headers: { 'Content-Type': 'application/json' } }));
      }
      var pages = options && options.pages;
      if (pages && Object.prototype.hasOwnProperty.call(pages, u)) {
        var html = pages[u].replace(/data-gen="\d+"/, 'data-gen="' + (window.__serverGen || 0) + '"');
        return Promise.resolve(new Response(html, { status: 200, headers: { 'Content-Type': 'text/html' } }));
      }
      if (options && options.tag && u === '/tag') {
        return Promise.resolve(new Response(JSON.stringify(options.tag), { status: 200, headers: { 'Content-Type': 'application/json' } }));
      }
      return Promise.resolve(new Response('not in the harness', { status: 404 }));
    };
  }

  function snapshot(r) {
    return r.frame.contentWindow ? r.frame.contentWindow.location.href : null;
  }

  // The link cases: did the page the message opened get a handle on the
  // frame, and did anything navigate the frame or the app?
  function checkClick(r, appHref, res, fails) {
    res.popup = r.popup;
    const frameHref = snapshot(r);
    if (!r.popup) { fails.push('popup did not report'); return; }
    if (r.c.control) {
      if (r.popup.opener !== 'present') fails.push('control: popup had no opener');
      if (frameHref === 'about:srcdoc') fails.push('control: frame navigation not detected');
      if (r.appHrefAfter !== appHref) fails.push('control: app navigated');
      return;
    }
    if (r.popup.opener !== 'null') fails.push('popup has window.opener');
    if (r.popup.referrer !== '') fails.push('popup got referrer ' + r.popup.referrer);
    if (frameHref !== 'about:srcdoc') fails.push('frame navigated after click: ' + frameHref);
    if (r.appHrefAfter !== appHref) fails.push('app navigated: ' + r.appHrefAfter);
  }

  function check(r, appHref) {
    const c = r.c, fails = [];
    const res = { id: c.id };
    res.blocked = [...r.blocked];
    for (const want of c.blocked || []) {
      if (!res.blocked.some((b) => b.includes(want))) fails.push('no CSP violation for ' + want);
    }
    if (c.click) checkClick(r, appHref, res, fails);
    if (c.control) return done();

    const prefix = c.id.slice(0, 3);
    if (window.__pwned !== undefined && String(window.__pwned).startsWith(prefix)) fails.push('pwned:' + window.__pwned);
    const frame = r.frame, doc = frame.contentDocument, win = frame.contentWindow;
    res.height = Math.round(frame.getBoundingClientRect().height);
    if (!r.loaded) fails.push('no load event');
    if (!(res.height > 0)) fails.push('height 0');
    if (!doc) { fails.push('no contentDocument'); return done(); }
    // Prototype methods: a clobbered document (33) must not break the check.
    const root = Object.getOwnPropertyDescriptor(Document.prototype, 'documentElement').get.call(doc);
    const qa = (sel) => Element.prototype.querySelectorAll.call(root, sel);
    const q = (sel) => Element.prototype.matches.call(root, sel) ? root : Element.prototype.querySelector.call(root, sel);
    if (win.location.href !== 'about:srcdoc') fails.push('navigated:' + win.location.href);

    const canary = q('.canary');
    res.canary = !!(canary && canary.getClientRects().length && canary.getBoundingClientRect().height > 0);
    if (!res.canary) fails.push('canary not rendered');

    const head = q('head'), first = head && head.firstElementChild;
    const csp = "default-src 'none'; img-src " + origin + (c.partBase || '/part/') + ' data:' +
      (c.remoteImages ? ' https:' : '') + "; style-src 'unsafe-inline'; font-src data:";
    if (!first || first.localName !== 'meta' || first.getAttribute('http-equiv') !== 'Content-Security-Policy' ||
        first.getAttribute('content') !== csp) fails.push('CSP meta not first in head');
    if (qa('meta').length !== 3) fails.push('foreign meta survived');
    const bases = qa('base');
    if (bases.length !== 1 || bases[0].getAttribute('href') !== null) fails.push('foreign base survived');

    const bad = qa(FORBIDDEN);
    if (bad.length) fails.push('forbidden: ' + [...bad].map((e) => e.localName).join(','));
    for (const el of qa('*')) {
      for (const a of el.attributes) {
        if (/^on/i.test(a.name)) fails.push('handler ' + el.localName + '[' + a.name + ']');
        if (/^(ping|attributionsrc|srcdoc|formaction)$/i.test(a.name)) fails.push('attr ' + a.name);
        if (/^\s*(javascript|vbscript|data:text)/i.test(a.value) && a.name !== 'title' && a.name !== 'alt') fails.push('script url in ' + a.name);
      }
    }
    const links = [...qa('a, area')];
    for (const a of links) {
      const href = a.getAttribute('href');
      if (a.getAttribute('target') !== '_blank') fails.push('link target ' + a.getAttribute('target'));
      if (!/\bnoopener\b/.test(a.rel) || !/\bnoreferrer\b/.test(a.rel)) fails.push('link rel ' + a.rel);
      if (href !== null && !LINK_OK.test(href)) fails.push('link href ' + href);
    }
    const hrefs = links.map((a) => a.getAttribute('href'));
    for (const want of c.links || []) if (!hrefs.includes(want)) fails.push('link lost ' + want);

    for (const [sel, prop, value] of c.styles || []) {
      const el = q(sel);
      const got = el && win.getComputedStyle(el).getPropertyValue(prop);
      if (got !== value) fails.push(sel + ' ' + prop + '=' + got + ' want ' + value);
    }
    for (const sel of c.imagesLoaded || []) {
      const els = qa(sel);
      if (!els.length) fails.push('missing ' + sel);
      for (const img of els) if (!(img.complete && img.naturalWidth > 0)) fails.push('not loaded ' + sel);
    }
    for (const sel of c.imagesBlocked || []) {
      for (const img of qa(sel)) if (img.naturalWidth > 0) fails.push('loaded ' + sel);
    }
    for (const sel of c.noSrc || []) {
      const els = qa(sel);
      if (!els.length) fails.push('missing ' + sel);
      for (const img of els) if (img.hasAttribute('src')) fails.push('kept src ' + img.getAttribute('src'));
    }
    // Substrings that must be gone from the assembled document: URLs the
    // filter drops from attributes, style attributes and <style> text.
    const serialized = root.outerHTML;
    for (const s of c.absent || []) if (serialized.includes(s)) fails.push('kept ' + s);
    for (const [sel, want] of c.cidSrc || []) {
      const el = q(sel);
      if (!el || el.getAttribute('src') !== want) fails.push('cid src ' + sel + '=' + (el && el.getAttribute('src')));
    }
    for (const [sel, want] of c.cidSrcset || []) {
      const el = q(sel);
      if (!el || !(el.getAttribute('srcset') || '').includes(want)) fails.push('cid srcset ' + sel);
    }
    for (const [sel, want] of c.cidStyle || []) {
      const el = q(sel);
      if (!el || !(el.getAttribute('style') || '').includes(want)) fails.push('cid style ' + sel);
    }
    for (const [sel, want] of c.text || []) {
      const el = q(sel);
      if (!el || !el.textContent.includes(want)) fails.push('text ' + sel);
    }
    for (const sel of c.present || []) {
      const el = q(sel);
      if (!el || !el.getClientRects().length) fails.push('not rendered ' + sel);
    }
    if (c.hscroll) {
      const html = root;
      if (!(html.scrollWidth > html.clientWidth)) fails.push('no horizontal scroll inside frame');
      if (frame.getBoundingClientRect().width > 640) fails.push('frame wider than its column');
    }
    if (c.remoteFlag && !r.remote) fails.push('remote content not flagged');
    // Body colors: whether the sanitized mail declares its own, and which
    // frame mode that chose (the frame's class must agree).
    if ('colors' in c && r.colors !== c.colors) fails.push('colors=' + r.colors + ' want ' + c.colors);
    if ('sheet' in c && (r.sheet !== c.sheet || frame.classList.contains('sheet') !== c.sheet)) {
      fails.push('sheet=' + r.sheet + ' class=' + frame.className + ' want ' + c.sheet);
    }
    // Sized to the content, border and margin included: nothing clipped
    // under overflow-y:hidden, and the frame no taller than it needs.
    if (c.fits) {
      if (root.scrollHeight > root.clientHeight) fails.push('clipped: ' + root.scrollHeight + ' > ' + root.clientHeight);
      const last = q('.last');
      if (!last || last.getBoundingClientRect().bottom > root.clientHeight) fails.push('last line clipped');
      // body's 8px bottom margin is the only slack expected under the last line.
      if (last && root.clientHeight - last.getBoundingClientRect().bottom > 12) fails.push('frame taller than content');
    }
    if (c.synthetic === 'keys' && r.keys.join() !== 'j') fails.push('keydown not forwarded: ' + r.keys.join());
    // JSON-LD (46–53): how many ld+json blocks the sanitize hook captured,
    // and the one declared action they yield, exactly, or none.
    if ('ldBlocks' in c && r.ldBlocks !== c.ldBlocks) fails.push('ldBlocks=' + r.ldBlocks + ' want ' + c.ldBlocks);
    if ('action' in c && JSON.stringify(r.action || null) !== JSON.stringify(c.action)) {
      fails.push('action=' + JSON.stringify(r.action) + ' want ' + JSON.stringify(c.action));
    }
    // The button heuristic (54-61): its pick, exactly, or none; links that
    // must not even be candidates (hidden ones, 54), or must be (59, 60);
    // the runner-up's host (60); whether the budget ran out (61); the frame
    // untouched.
    if ('guess' in c) {
      const g = r.guess;
      if (!g || !g.layout) fails.push('guess: no layout');
      else {
        if (JSON.stringify(g.pick) !== JSON.stringify(c.guess)) fails.push('guess=' + JSON.stringify(g.pick) + ' want ' + JSON.stringify(c.guess) + ' ranked ' + g.hosts.join(','));
        for (const h of c.notCandidates || []) if (g.hosts.includes(h)) fails.push('candidate ' + h);
        for (const h of c.rankedHosts || []) if (!g.hosts.includes(h)) fails.push('not a candidate: ' + h);
        if ('runnerUp' in c && g.runnerUp !== c.runnerUp) fails.push('runnerUp=' + g.runnerUp + ' want ' + c.runnerUp);
        if (g.over !== !!c.over) fails.push('over budget: ' + g.over);
        if (g.touched) fails.push('the guess changed the frame document');
      }
    }
    // DOMPurify hooks are global: assembly's must be gone once it returns.
    // removeHook with no function pops the last one, so any left is found.
    if ('ldBlocks' in c && DOMPurify.removeHook('uponSanitizeElement')) fails.push('sanitize hook left installed');
    return done();

    function done() {
      res.fails = fails;
      res.pass = fails.length === 0;
      return res;
    }
  }
})();
</script>
</body>
</html>
