<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>no colors</title>
<style>
h1 { font-size: 20px; }
.note { background: transparent; color: inherit; }
</style>
</head>
<body>
<h1>Plain HTML</h1>
<p class="canary">44 no colors: nothing here sets a background or text color (keywords and an empty attribute don't count), so this renders in the app's colors.</p>
<p class="note" style="color:currentcolor;background-color:transparent">A <a href="https://example.com/44">link</a> in the accent color. <font color="">empty font color</font>.</p>
<div class="last">last line</div>
</body>
</html>
